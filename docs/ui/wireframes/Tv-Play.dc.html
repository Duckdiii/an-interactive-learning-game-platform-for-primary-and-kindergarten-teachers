<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tivi lớp – Chơi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#1B2333}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #FFF4DC; position: relative; overflow: hidden">
  <div style="position: absolute; top: 20px; left: 40px; right: 40px; height: 92px; display: flex; align-items: center; gap: 18px">
    <span style="background: #FFFFFF; border: 3px solid #E8C98A; border-radius: 24px; padding: 8px 20px; font-size: 26px; font-weight: 900; color: #3A2A00">Câu 2/5</span>
    <div style="display: flex; gap: 8px" aria-label="Đã xong 1 trên 5 câu">
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </sc-for>
    </div>
    <span style="font-size: 14px; font-weight: 700; color: #6B5A30">(biểu tượng tiến độ lấy theo theme)</span>
    <button aria-label="Đọc lại đề bài" style="margin-left: auto; height: 84px; padding: 0 26px; border-radius: 26px; border: 4px solid #1F5BD8; background: #FFFFFF; box-shadow: 0 6px 0 #1F5BD8; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 900; color: #1F3F7A; cursor: pointer">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1F5BD8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Đọc lại
    </button>
  </div>
  <div style="position: absolute; top: 128px; left: 40px; right: 250px; bottom: 112px; box-sizing: border-box; border: 4px dashed #6B7FA8; border-radius: 28px; background: repeating-linear-gradient(45deg, #FFFBF1 0 16px, #FBF0D9 16px 32px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: #3A4A6B">
    <strong style="font-size: 34px">Khu vực trò chơi</strong>
    <span style="font-size: 18px; font-weight: 700">Renderer theo loại game: QUIZ, MATCHING, DRAG_DROP…</span>
    <span style="font-size: 18px; font-weight: 700">Bé nói hoặc chỉ đáp án, giáo viên bấm chọn thay bằng chuột</span>
  </div>
  <div style="position: absolute; top: 160px; right: 40px; width: 190px; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div style="background: #FFFFFF; border: 3px solid #1B2333; border-radius: 20px; padding: 12px 14px; font-size: 20px; font-weight: 800; text-align: center">Bạn nào biết nào?</div>
    <div style="width: 180px; height: 180px; box-sizing: border-box; border-radius: 50%; border: 4px dashed #6B7FA8; background: rgba(255,255,255,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #3A4A6B; padding: 12px">
      <strong style="font-size: 17px">Nhân vật theo theme</strong>
      <span style="font-size: 14px; font-weight: 700">trạng thái: hỏi</span>
    </div>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; bottom: 20px; height: 72px; box-sizing: border-box; border-radius: 20px; background: rgba(19,30,52,0.94); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #FFFFFF">
    <span style="background: #34476B; border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 800">Giáo viên</span>
    <button style="height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #4A5B7D; background: #22324F; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Câu trước</button>
    <button style="height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #4A5B7D; background: #22324F; color: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer">Cho thử lại</button>
    <button style="height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #4A5B7D; background: #22324F; color: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer">Gợi ý</button>
    <button style="height: 48px; padding: 0 16px; border-radius: 12px; border: none; background: #FF9F1C; color: #3B2200; font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 6px; cursor: pointer">Câu sau<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B2200" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button aria-label="Tạm dừng" style="width: 48px; height: 48px; border-radius: 12px; border: 2px solid #4A5B7D; background: #22324F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button style="height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #4A5B7D; background: #22324F; color: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer">Kết thúc</button>
    <span style="margin-left: auto; font-size: 14px; font-weight: 700; color: #C9D3E6">← → chuyển câu · R đọc lại · tự ẩn sau 3 giây</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const stars = [0,1,2,3,4].map((i) => i < 1 ? { fill: '#FFC93C', stroke: '#B07800' } : { fill: '#FFFFFF', stroke: '#C9B48A' });
    return { stars };
  }
}
</script>
</body>
</html>
