<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tivi lớp – Kết quả cả lớp</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#1B2333}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #FFF4DC; position: relative; overflow: hidden">
  <div style="position: absolute; top: 50px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 18px">
    <h1 style="margin: 0; font-size: 76px; font-weight: 900; color: #1B2333">Cả lớp giỏi quá!</h1>
    <p style="margin: 0; font-size: 30px; font-weight: 800; color: #3A2A00">Lớp mình trả lời đúng 4/5 câu</p>
    <div style="display: flex; gap: 14px" aria-label="4 trên 5 câu đúng">
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
        <svg width="80" height="80" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </sc-for>
    </div>
    <div style="width: 200px; height: 200px; box-sizing: border-box; border-radius: 50%; border: 4px dashed #6B7FA8; background: rgba(255,255,255,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #3A4A6B">
      <strong style="font-size: 18px">Nhân vật theo theme</strong>
      <span style="font-size: 14px; font-weight: 700">trạng thái: ăn mừng</span>
    </div>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; bottom: 20px; height: 72px; box-sizing: border-box; border-radius: 20px; background: rgba(19,30,52,0.94); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #FFFFFF">
    <span style="background: #34476B; border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 800">Giáo viên</span>
    <button style="height: 48px; padding: 0 18px; border-radius: 12px; border: none; background: #FF9F1C; color: #3B2200; font-size: 16px; font-weight: 900; cursor: pointer">Chơi lại</button>
    <button style="height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid #4A5B7D; background: #22324F; color: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer">Xem lại từng câu</button>
    <button style="height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid #4A5B7D; background: #22324F; color: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer">Kết thúc buổi chơi</button>
    <span style="margin-left: auto; font-size: 14px; font-weight: 700; color: #C9D3E6">Không hiển thị điểm từng bé</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const stars = [0,1,2,3,4].map((i) => i < 4 ? { fill: '#FFC93C', stroke: '#B07800' } : { fill: '#FFFFFF', stroke: '#C9B48A' });
    return { stars };
  }
}
</script>
</body>
</html>
