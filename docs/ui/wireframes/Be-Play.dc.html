<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bé ở nhà – Chơi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#1B2333}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1024px; height: 640px; box-sizing: border-box; background: #FFF4DC; position: relative; overflow: hidden">
  <div style="position: absolute; top: 18px; left: 24px; right: 24px; height: 84px; display: flex; align-items: center; gap: 10px">
    <div style="display: flex; gap: 6px; background: #FFFFFF; border: 3px solid #E8C98A; border-radius: 30px; padding: 8px 14px" aria-label="Đã xong 2 trên 5 câu">
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
        <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </sc-for>
    </div>
    <button aria-label="Nghe lại đề bài" style="margin-left: auto; width: 84px; height: 84px; border-radius: 26px; border: 4px solid #1F5BD8; background: #FFFFFF; box-shadow: 0 6px 0 #1F5BD8; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#1F5BD8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>
  <div style="position: absolute; top: 118px; left: 170px; right: 24px; bottom: 24px; box-sizing: border-box; border: 4px dashed #6B7FA8; border-radius: 28px; background: repeating-linear-gradient(45deg, #FFFBF1 0 16px, #FBF0D9 16px 32px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; color: #3A4A6B">
    <strong style="font-size: 30px">Khu vực trò chơi</strong>
    <span style="font-size: 17px; font-weight: 700">Renderer theo loại game, toàn bộ phần còn lại của màn hình</span>
    <span style="font-size: 17px; font-weight: 700">Bé chạm là chấm · vùng chạm phóng to theo hitboxScale</span>
  </div>
  <div style="position: absolute; left: 20px; bottom: 90px; width: 136px; height: 136px; box-sizing: border-box; border-radius: 50%; border: 4px dashed #6B7FA8; background: rgba(255,255,255,0.75); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #3A4A6B; padding: 8px">
    <strong style="font-size: 14px">Nhân vật theo theme</strong>
    <span style="font-size: 12px; font-weight: 700">vui / an ủi / gợi ý</span>
  </div>
  <button aria-label="Cài đặt cho người lớn: nhấn giữ 3 giây" style="position: absolute; left: 20px; bottom: 24px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #B89A5C; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5A30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const stars = [0,1,2,3,4].map((i) => i < 2 ? { fill: '#FFC93C', stroke: '#B07800' } : { fill: '#FFFFFF', stroke: '#C9B48A' });
    return { stars };
  }
}
</script>
</body>
</html>
