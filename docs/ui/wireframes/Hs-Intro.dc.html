      <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; line-height: 1.4"><span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #1F5BD8; color: #FFFFFF; font-weight: 900; display: flex; align-items: center; justify-content: center">1</span>Mỗi câu là một màn chơi. Cách chơi chi tiết hiện ở màn đầu tiên.</div>
      <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; line-height: 1.4"><span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #1F5BD8; color: #FFFFFF; font-weight: 900; display: flex; align-items: center; justify-content: center">2</span>Trả lời đúng được điểm, đúng liên tiếp được thưởng thêm.</div>
      <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; line-height: 1.4"><span style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #1F5BD8; color: #FFFFFF; font-weight: 900; display: flex; align-items: center; justify-content: center">3</span>Chơi xong được xem lại đáp án.</div>
    </div>
