<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bé ở nhà – Kết quả</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#1B2333}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1024px; height: 640px; box-sizing: border-box; background: #FFF4DC; position: relative; overflow: hidden">
  <div style="position: absolute; top: 40px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <h1 style="margin: 0; font-size: 60px; font-weight: 900">Giỏi quá!</h1>
    <div style="display: flex; gap: 12px" aria-label="4 trên 5 câu đúng">
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
        <svg width="70" height="70" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 110px; top: 230px; width: 200px; height: 200px; box-sizing: border-box; border-radius: 50%; border: 4px dashed #6B7FA8; background: rgba(255,255,255,0.75); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #3A4A6B">
    <strong style="font-size: 17px">Nhân vật theo theme</strong>
    <span style="font-size: 13px; font-weight: 700">trạng thái: ăn mừng</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center">
    <button style="height: 92px; padding: 0 42px; border-radius: 46px; border: 5px solid #8A4B00; background: #FF9F1C; box-shadow: 0 7px 0 #8A4B00; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 900; color: #3B2200; cursor: pointer">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3B2200" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Chơi lại
    </button>
  </div>
  <div style="position: absolute; right: 40px; top: 240px; width: 280px; background: #FFFFFF; border: 2px solid #C9B48A; border-radius: 16px; padding: 14px 16px">
    <p style="margin: 0 0 6px; font-size: 14px; font-weight: 800; color: #1F3F7A">Dành cho phụ huynh</p>
    <p style="margin: 0; font-size: 15px; line-height: 1.4; font-weight: 600">Bé làm đúng 4/5 câu chủ đề "Đếm số lượng". Thử cùng bé đếm đồ vật trong nhà để ôn thêm.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const stars = [0,1,2,3,4].map((i) => i < 4 ? { fill: '#FFC93C', stroke: '#B07800' } : { fill: '#FFFFFF', stroke: '#C9B48A' });
    return { stars };
  }
}
</script>
</body>
</html>
