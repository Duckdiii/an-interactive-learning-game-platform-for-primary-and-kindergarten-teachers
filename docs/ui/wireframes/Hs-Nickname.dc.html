<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Học sinh – Biệt danh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#1B2333}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FB; padding: 32px 24px; display: flex; flex-direction: column; gap: 22px">
  <div style="background: #FFFFFF; border: 2px solid #D5DEEA; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <div style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 12px; border: 2px dashed #6B7FA8; background: #F4F7FB; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #3A4A6B; text-align: center">Ảnh theme</div>
    <div>
      <p style="margin: 0; font-size: 17px; font-weight: 900">Đếm con vật</p>
      <p style="margin: 2px 0 0; font-size: 14px; font-weight: 700; color: #4A5568">Toán · Lớp 2 · 10 câu</p>
    </div>
  </div>
  <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 900">Bạn tên là gì trong trò chơi?</h1>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="nick" style="font-size: 15px; font-weight: 800">Biệt danh</label>
    <div style="display: flex; gap: 10px">
      <input id="nick" value="Ong Vàng 27" maxlength="16" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; border-radius: 14px; border: 3px solid #1F5BD8; background: #FFFFFF; padding: 0 14px; font-size: 20px; font-weight: 800; color: #1B2333">
      <button aria-label="Gợi ý biệt danh ngẫu nhiên" style="width: 56px; height: 56px; border-radius: 14px; border: 3px solid #1F5BD8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F5BD8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="#1F5BD8"/><circle cx="15.5" cy="15.5" r="1.2" fill="#1F5BD8"/><circle cx="12" cy="12" r="1.2" fill="#1F5BD8"/></svg>
      </button>
    </div>
    <p style="margin: 0; font-size: 13px; font-weight: 600; color: #4A5568">Đừng dùng tên thật. Từ ngữ không phù hợp sẽ bị chặn.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 800">Chọn hình đại diện</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{avatars}}" as="a" hint-placeholder-count="8">
        <button aria-label="{{a.label}}" style="{{a.style}}">
          <svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><circle cx="14" cy="17" r="3" fill="#1B2333"/><circle cx="26" cy="17" r="3" fill="#1B2333"/><path d="M13 25 Q20 31 27 25" stroke="#1B2333" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
        </button>
      </sc-for>
    </div>
  </div>
  <button style="margin-top: auto; height: 60px; border-radius: 16px; border: none; background: #1F5BD8; color: #FFFFFF; font-size: 20px; font-weight: 900; box-shadow: 0 5px 0 #133C94; cursor: pointer">Tiếp tục</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = ['#FFD43B','#FF9EBB','#7CC8FF','#8BD98B','#FFB347','#B79CFF','#5EEAD4','#FCA5A5'];
    const avatars = colors.map((c, i) => ({
      label: 'Hình đại diện ' + (i + 1),
      style: 'aspect-ratio: 1; border-radius: 50%; background: ' + c + '; display: flex; align-items: center; justify-content: center; cursor: pointer; ' + (i === 0 ? 'border: 4px solid #1F5BD8; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 6px #1F5BD8' : 'border: 3px solid #FFFFFF')
    }));
    return { avatars };
  }
}
</script>
</body>
</html>
