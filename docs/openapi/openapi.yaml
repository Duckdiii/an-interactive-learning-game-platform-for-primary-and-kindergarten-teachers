openapi: 3.1.0

info:
  title: AI-Game Platform REST API
  version: 1.1.0
  summary: Hợp đồng REST API giữa Backend (Spring Boot) và Frontend (React).
  description: |
    Bản máy đọc được của `REST API Contract v1.1.0` (thiết kế trước, code theo sau).

    **Trạng thái tài liệu:** NHÁP, đang viết dần theo nhóm endpoint.
    Đã có đủ các nhóm: quy ước chung, **Auth**, **Games**, **Media**, **Sessions/Play**, **Admin**.

    **Quy ước đánh dấu** (extension `x-status` trên từng operation):
    - `implemented`: Backend đã cài đúng như mô tả.
    - `extended-pending`: endpoint đã có nhưng phần mở rộng trong mô tả chưa cài.
    - `planned`: chưa cài, hai phía code song song theo đúng mô tả.

    **Response envelope:** mọi response JSON đều có dạng `{ "success": true, "data": ... }`
    hoặc `{ "success": false, "error": { "code", "message", "details?" } }`.
    Các endpoint trả 204 không có body.

    **Học sinh (public):** sau khi vào phiên, mọi request gửi header `X-Participant-Id`
    (sẽ mô tả ở nhóm Sessions).
  contact:
    name: Nhóm đồ án AI-Game Platform

servers:
  - url: http://localhost:8080/api
    description: Môi trường dev

tags:
  - name: Auth
    description: Đăng ký, đăng nhập, làm mới token, đăng xuất, quên mật khẩu (UC-01, UC-15).
  - name: Games
    description: |
      AI sinh game, kho học liệu, Workspace Editor, xuất bản (UC-02, 04, 05, 06, 07). Chỉ dành cho
      giáo viên (`ROLE_TEACHER`) và chỉ truy cập được game của chính mình (game của người khác trả 403).
      Toàn bộ nhóm này **chưa cài** ở Backend (`x-status: planned`).
  - name: Media
    description: Tải lên ảnh/âm thanh riêng cho thẻ câu hỏi (UC-05).
  - name: Sessions
    description: |
      Giáo viên tạo và điều khiển phiên Live Arena (`SOLO`, `TEAM`), xem kết quả (UC-09).
      Trạng thái: `WAITING` → `ACTIVE` → `PAUSED` → `ACTIVE` → `CLOSED`.
      Chế độ Duel và Family chưa nằm trong hợp đồng.
  - name: Play
    description: |
      Endpoint của học sinh (public, không cần đăng nhập). Sau khi vào phiên, mọi request gửi header
      `X-Participant-Id`. Quy tắc an toàn: `participantId` là UUID ngẫu nhiên và **không bao giờ được gửi
      cho học sinh khác** (bảng xếp hạng và sự kiện WebSocket cho học sinh chỉ có hạng, biệt danh, điểm,
      đội); chỉ truyền qua header trên HTTPS; Backend kiểm tra `participantId` thuộc đúng phiên và phiên
      `ACTIVE` mới cho nộp câu trả lời. Hệ thống chỉ lưu biệt danh, không lưu thông tin nhận dạng (NFR-02).
  - name: Admin
    description: |
      Quản trị viên (`ROLE_ADMIN`; sai vai trò trả 403) và **mọi thao tác được ghi vào Audit Log**.
      Triển khai hai đợt, đánh dấu bằng `x-phase`:
      - **Đợt (a)** nền tảng và bảo mật: vai trò `ROLE_ADMIN` trong JWT, quản lý giáo viên, Audit Log.
      - **Đợt (b)** vận hành và AI: chi phí và trạng thái dịch vụ, cấu hình bộ não AI, từ cấm.
      Tài khoản quản trị viên do hệ thống cấp sẵn từ `ADMIN_EMAIL` và `ADMIN_PASSWORD`.
  - name: Realtime
    description: |
      **WebSocket không nằm trong OpenAPI.** Sự kiện realtime đi qua STOMP over SockJS broker
      `/ws/live-arena`. Đích: `/topic/session/{sessionId}/...` (server phát) và
      `/app/session/{sessionId}/...` (client gửi). Giáo viên xác thực bằng access token, học sinh bằng
      `X-Participant-Id` ngay ở bước `CONNECT`. Frontend hiển thị `Connected`, `Reconnecting`,
      `Disconnected` (FLD-24). Message format chi tiết chốt ở tài liệu WebSocket riêng; theo SRS tối thiểu
      có các sự kiện: có người vào/rời phòng (giáo viên nhận); đổi trạng thái phiên `start, pause,
      resume, close` (tất cả); cập nhật tiến trình participant (giáo viên); cập nhật bảng xếp hạng sau
      mỗi câu được chấm, độ trễ dưới 100 ms (tất cả, NFR-01); xếp đội (tất cả, phiên `TEAM`). Sự kiện gửi
      cho học sinh không chứa `participantId` của học sinh khác.

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Đăng ký tài khoản giáo viên
      description: |
        Tài khoản đăng ký luôn là `ROLE_TEACHER`. Tài khoản quản trị viên do hệ thống
        cấp sẵn từ biến môi trường `ADMIN_EMAIL` và `ADMIN_PASSWORD`, không đăng ký qua API này.

        Phần mở rộng chưa cài ở Backend: `school` và `acceptedPolicy` (UC-01 4c).
      x-status: extended-pending
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    $ref: '#/components/schemas/RegisterResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Đăng nhập
      description: |
        Trả `accessToken` trong body. **Refresh token không nằm trong body**, được đặt vào cookie
        HttpOnly `refresh_token` qua header `Set-Cookie` (xem mục *Cookie refresh token* ở dưới).

        `rememberMe: true` kéo dài refresh token và cookie lên 30 ngày (mặc định 24 giờ).

        > **Sẽ đổi ở Frontend:** code Frontend hiện còn theo contract v1.0.0 (đọc `refreshToken`
        > từ body và dùng `AuthUser.id`). Cần chuyển sang cookie và `teacherId`.

        Phần mở rộng chưa cài: `rememberMe`, `role` trong `teacher`, lỗi `ACCOUNT_LOCKED`,
        `LOGIN_TEMPORARILY_LOCKED`.
      x-status: extended-pending
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `ACCOUNT_LOCKED`: tài khoản bị quản trị viên khoá. Chỉ trả khi **mật khẩu đúng**
            (tránh dò email có tồn tại hay không).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            `LOGIN_TEMPORARILY_LOCKED`: đăng nhập sai quá 5 lần liên tiếp, khoá 15 phút.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Làm mới access token
      description: |
        Không có body, không cần `Authorization`. Trình duyệt tự gửi cookie `refresh_token`
        (Frontend bật `withCredentials: true`).

        Response giống `/auth/login`, kèm `Set-Cookie` với refresh token mới (rotation: token cũ
        bị vô hiệu). Nếu refresh token **cũ đã bị dùng rồi** được dùng lại (dấu hiệu bị lộ),
        Backend thu hồi cả chuỗi token cùng phiên đăng nhập.
      x-status: implemented
      security:
        - refreshCookie: []
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`ACCOUNT_LOCKED`: tài khoản vừa bị khoá.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Đăng xuất
      description: Thu hồi refresh token hiện tại và xoá cookie (`Set-Cookie` với `Max-Age=0`).
      x-status: implemented
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã đăng xuất, không có body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Yêu cầu liên kết đặt lại mật khẩu
      description: |
        Response **luôn giống nhau** dù email có tồn tại hay không (tránh dò tài khoản).
        Nếu email tồn tại, Backend gửi thư chứa liên kết `https://<frontend>/reset-password?token=...`;
        token dùng một lần, hết hạn sau 30 phút, lưu dạng băm. Giới hạn 3 yêu cầu mỗi giờ mỗi email.

        Môi trường dev: Backend in liên kết ra log thay vì gửi email (tuyệt đối không bật khi
        triển khai thật). Cấu hình SMTP lấy từ biến môi trường.
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  examples: [a@school.edu.vn]
      responses:
        '200':
          description: Đã tiếp nhận yêu cầu.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                        examples: [Nếu email tồn tại, liên kết đặt lại mật khẩu đã được gửi.]
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Đặt lại mật khẩu bằng token
      description: |
        Thành công thì thu hồi mọi refresh token của tài khoản và xoá bộ đếm đăng nhập sai.
        Lỗi 400 khi liên kết hết hạn/không hợp lệ, hoặc mật khẩu mới không đạt yêu cầu.
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  description: Token nhận từ liên kết trong email.
                newPassword:
                  $ref: '#/components/schemas/Password'
      responses:
        '204':
          description: Đã đặt lại mật khẩu, không có body.
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/generate:
    post:
      tags: [Games]
      operationId: generateGame
      summary: AI sinh game (UC-02)
      description: |
        Nhận `application/json`, hoặc `multipart/form-data` khi đính kèm tệp giáo án.
        Phải có **ít nhất một** trong `idea`, `file`, `randomTopic`; thiếu cả ba thì 400
        "Vui lòng nhập ý tưởng hoặc tải giáo án". Có `idea` và `file` cùng lúc thì dùng cả hai.
        `metadata.topic` và `metadata.title` do hệ thống rút ra từ ý tưởng.

        Kết quả là `GameResponse` với `status: DRAFT` (đã lưu vào kho học liệu), đã qua đủ 3 lớp
        kiểm duyệt, media đã gắn (`imageUrl` từ Pexels, `audioUrl` từ TTS) khi có thể.

        **Tiến trình (NFR-01):** nếu gửi `Accept: text/event-stream`, response là luồng SSE thay cho
        JSON: sự kiện `progress` (`{ "step", "percent" }`, `step` thuộc `ANALYZING, VALIDATING,
        FETCHING_IMAGES, GENERATING_AUDIO, SAVING`), rồi kết thúc bằng một sự kiện `result`
        (dữ liệu `GameResponse`) hoặc `error` (`{ "code", "message" }`). `EventSource` không gửi được
        POST nên Frontend dùng `fetch` đọc luồng. Thứ tự cài đặt: bản JSON đồng bộ trước, SSE sau cùng.

        Xử lý có thể mất vài giây đến vài chục giây; Frontend đặt timeout riêng lớn hơn mặc định.
        Giới hạn 10 yêu cầu mỗi phút mỗi người dùng (NFR-04).
      x-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateGameRequest'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/GenerateGameRequest'
                - type: object
                  properties:
                    file:
                      type: string
                      format: binary
                      description: Giáo án `.docx` hoặc `.pdf`, tối đa 10MB (FLD-04).
            encoding:
              voice:
                contentType: application/json
      responses:
        '200':
          description: |
            Game đã sinh. Với `Accept: text/event-stream` là luồng SSE (xem mô tả endpoint).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResult'
            text/event-stream:
              schema:
                type: string
                description: Các sự kiện SSE `progress`, rồi `result` hoặc `error`.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /games:
    get:
      tags: [Games]
      operationId: listGames
      summary: Dashboard, danh sách game của giáo viên đang đăng nhập
      description: Sắp xếp `updatedAt` giảm dần. Chưa phân trang.
      x-status: planned
      security:
        - bearerAuth: []
      parameters:
        - name: subject
          in: query
          schema:
            $ref: '#/components/schemas/Subject'
        - name: gradeLevel
          in: query
          schema:
            $ref: '#/components/schemas/GradeLevel'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/GameStatus'
      responses:
        '200':
          description: Mảng `GameSummary` (không kèm `questions[]`).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [Games]
      operationId: getGame
      summary: Mở Workspace Editor
      x-status: planned
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/GameSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Games]
      operationId: updateGame
      summary: Lưu bản nháp / chỉnh sửa thủ công (UC-04, UC-05)
      description: |
        Body là **chỉ phần envelope DSL**. Id lấy từ đường dẫn; `gameId, status, updatedAt` do server
        quản. `gameType` không đổi được.

        Backend chạy lại đủ 3 lớp kiểm duyệt trước khi lưu, tự ghi `EditLog` (người sửa là giáo viên)
        và tự so sánh với bản cũ để biết trường nào bị sửa (phục vụ KPI-03, không cần endpoint riêng).
        Lưu bản nháp **không** bắt buộc đủ `hitRegion` của SPOT_THE_TARGET (nới lỏng so với JSON
        Schema DSL, chỉ bắt buộc khi xuất bản).

        Game đang `PUBLISHED` vẫn giữ `PUBLISHED`. **Nếu game đang có phiên chưa kết thúc**
        (`WAITING`, `ACTIVE` hoặc `PAUSED`) thì bị từ chối 409 `CONFLICT`.
      x-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameEnvelope'
      responses:
        '200':
          $ref: '#/components/responses/GameSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Games]
      operationId: deleteGame
      summary: Xoá game
      description: Bị từ chối 409 `CONFLICT` nếu game đang có phiên chưa kết thúc.
      x-status: planned
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã xoá, không có body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{gameId}/publish:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      tags: [Games]
      operationId: publishGame
      summary: Xuất bản (UC-07)
      description: |
        Body tuỳ chọn. Nếu gửi envelope DSL như `PUT`, Backend **lưu nội dung mới nhất rồi xuất bản
        trong một thao tác** (UC-07 luồng chính, UC-04 4c); không gửi body thì xuất bản bản đã lưu.

        `shareCode` gồm 6 ký tự chữ và số, giữ nguyên khi xuất bản lại. Gọi lại khi đã `PUBLISHED`
        vẫn trả 200. Frontend vẽ mã QR từ `shareUrl` bằng `qrcode.react`.

        400 khi dữ liệu chưa hợp lệ (câu chưa có đáp án đúng, cấu trúc chưa hoàn chỉnh) hoặc game
        SPOT_THE_TARGET còn câu chưa có `hitRegion` (UC-07 2c). 500 khi không lưu được hoặc không tạo
        được mã chia sẻ (UC-07 2a, 2b): game không chuyển sang `PUBLISHED`.
      x-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameEnvelope'
      responses:
        '200':
          description: Đã xuất bản.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    $ref: '#/components/schemas/PublishResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{gameId}/regenerate:
    parameters:
      - $ref: '#/components/parameters/GameId'
    post:
      tags: [Games]
      operationId: regenerateGame
      summary: Làm lại toàn bộ trò chơi (UC-06 4a)
      description: |
        Giữ nguyên `gameId`, **thay toàn bộ `questions[]` và lưu**, `status` đặt về `DRAFT`. Giáo viên
        chọn chức năng này là chủ ý bỏ nội dung đang có. Bị từ chối 409 `CONFLICT` nếu game đang có phiên
