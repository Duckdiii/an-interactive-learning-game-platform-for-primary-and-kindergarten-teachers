        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  examples: [v1.0.0]
      responses:
        '200':
          $ref: '#/components/responses/AiConfigVersionSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/ai-config/versions/{versionId}/activate:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Admin]
      operationId: adminActivateAiConfigVersion
      summary: Khôi phục phiên bản làm bản đang áp dụng
      description: Các lời gọi AI sau đó dùng phiên bản đang áp dụng.
      x-status: planned
      x-phase: b
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AiConfigVersionSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/safety/blocked-words:
    get:
      tags: [Admin]
      operationId: adminGetBlockedWords
      summary: Danh sách từ cấm an toàn học đường (FLD-25)
      x-status: planned
      x-phase: b
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/BlockedWordsSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Admin]
      operationId: adminReplaceBlockedWords
      summary: Thay toàn bộ danh sách từ cấm
      description: |
        Backend nạp lại bộ nhớ (hot reload), không cần khởi động lại. Từ trong danh sách còn áp dụng cho
        nickname và nội dung do giáo viên nhập. Đợt (b) cần chuyển danh sách từ tệp tĩnh sang nơi lưu
        có thể sửa lúc chạy.
      x-status: planned
      x-phase: b
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedWords'
      responses:
        '200':
          $ref: '#/components/responses/BlockedWordsSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (hết hạn sau 900 giây). JWT mang claim vai trò: `ROLE_TEACHER` cho mọi
        endpoint ngoài `/admin`, `ROLE_ADMIN` cho `/admin/**`. Sai vai trò trả 403 `FORBIDDEN`.
    participantId:
      type: apiKey
      in: header
      name: X-Participant-Id
      description: |
        UUID do `join` hoặc `play` trả về. Backend phải thêm header này vào danh sách CORS cho phép.
        Thay cho đăng nhập ở các endpoint của học sinh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Cookie HttpOnly do Backend đặt khi login/refresh. JavaScript không đọc được.

        | Thuộc tính | Giá trị |
        |---|---|
        | `HttpOnly` | Có |
        | `Secure` | Theo môi trường (`COOKIE_SECURE`, mặc định `true`) |
        | `SameSite` | `Strict` |
        | `Path` | `/api/auth` |
        | Thời hạn | 24 giờ (30 ngày nếu `rememberMe`) |

  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Trang, bắt đầu từ 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TeacherId:
      name: teacherId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareCode:
      name: shareCode
      in: path
      required: true
      description: Mã chia sẻ 6 ký tự chữ và số của game đã xuất bản.
      schema:
        type: string
        pattern: '^[A-Za-z0-9]{6}$'
        examples: [A3F9K2]
    QuestionId:
      name: questionId
      in: path
      required: true
      description: Id câu hỏi theo DSL (`q1`, `q2`...).
      schema:
        type: string
        examples: [q1]

  headers:
    RetryAfter:
      description: Số giây cần chờ trước khi thử lại; Frontend hiển thị đếm ngược.
      schema:
        type: integer
        minimum: 1
    SetRefreshCookie:
      description: |
        `refresh_token=<token>; HttpOnly; SameSite=Strict; Path=/api/auth; Max-Age=<giây>`
        (thêm `Secure` theo cấu hình môi trường).
      schema:
        type: string
    ClearRefreshCookie:
      description: '`refresh_token=; HttpOnly; SameSite=Strict; Path=/api/auth; Max-Age=0`'
      schema:
        type: string

  responses:
    AuthSuccess:
      description: Thành công; refresh token nằm ở cookie, không nằm trong body.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SetRefreshCookie'
        Cache-Control:
          description: Luôn là `no-store`.
          schema:
            type: string
            examples: [no-store]
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                $ref: '#/components/schemas/AuthData'
    ValidationError:
      description: |
        `VALIDATION_ERROR`: request sai định dạng hoặc vi phạm ràng buộc. `error.details.fields`
        liệt kê lỗi theo từng trường khi có.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        `UNAUTHORIZED`: thiếu hoặc hết hạn access token; sai email/mật khẩu; refresh token không
        hợp lệ hoặc đã bị thu hồi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GameSuccess:
      description: '`GameResponse` đầy đủ (dạng dành cho giáo viên, có trường đáp án).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameResult'
    AdminTeacherSuccess:
      description: Thông tin giáo viên.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                $ref: '#/components/schemas/AdminTeacher'
    TeacherStatusSuccess:
      description: Trạng thái tài khoản sau khi đổi.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                type: object
                required: [teacherId, status]
                properties:
                  teacherId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/TeacherAccountStatus'
    AiConfigVersionSuccess:
      description: Phiên bản cấu hình AI sau thay đổi.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                $ref: '#/components/schemas/AiConfigVersion'
    BlockedWordsSuccess:
      description: Danh sách từ cấm hiện tại.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                $ref: '#/components/schemas/BlockedWords'
    SessionControlSuccess:
      description: Trạng thái phiên sau khi chuyển.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data:
                type: object
                required: [sessionId, status]
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/SessionStatus'
    Forbidden:
      description: |
        `FORBIDDEN`: sai vai trò, hoặc tài nguyên thuộc người khác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: '`NOT_FOUND`: game/phiên/mã không tồn tại.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        `CONFLICT`: xung đột trạng thái nghiệp vụ, ví dụ game đang có phiên chưa kết thúc
        (`WAITING`, `ACTIVE`, `PAUSED`): "Game đang có phiên chơi diễn ra, hãy kết thúc phiên trước khi sửa".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableContent:
      description: |
        Một trong các mã 422:
        - `UNSAFE_CONTENT`: ý tưởng, giáo án, nội dung AI sinh ra hoặc nội dung sửa tay không an toàn.
          Backend **không** tự sinh lại; khi sửa tay thì giữ nguyên bản cũ.
        - `FILE_TOO_LARGE_OR_INVALID_FORMAT`: tệp giáo án sai định dạng hoặc quá 10MB.
        - `CONTENT_NOT_AGE_APPROPRIATE`: kiến thức chưa phù hợp lứa tuổi (UC-02 4a);
          `error.details.suggestions` là mảng gợi ý, ví dụ
          `[ { "type": "CHANGE_GRADE", "gradeLevel": "GRADE_4" }, { "type": "CHANGE_TOPIC", "idea": "..." } ]`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AiTimeout:
      description: |
        `AI_GENERATION_TIMEOUT`: dịch vụ AI timeout sau khi Backend đã gọi lại tối đa 2 lần.
        Frontend giữ lại ý tưởng đã nhập để thử lại không phải nhập lại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: '`RATE_LIMITED`: vượt giới hạn tần suất.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: '`INTERNAL_ERROR`: luôn trả thông điệp chung, không lộ chi tiết hệ thống.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorCode:
      type: string
      description: |
        | code | HTTP | Trạng thái | Khi nào dùng |
        |---|---|---|---|
        | `VALIDATION_ERROR` | 400 | đã cài | Request sai định dạng hoặc vi phạm ràng buộc (kể cả email đã đăng ký) |
        | `UNAUTHORIZED` | 401 | đã cài | Thiếu/hết hạn access token; sai email hoặc mật khẩu; refresh token không hợp lệ |
        | `FORBIDDEN` | 403 | đã cài | Sai vai trò, tài nguyên của người khác |
        | `NOT_FOUND` | 404 | đã cài | Game/session/mã không tồn tại |
        | `FILE_TOO_LARGE_OR_INVALID_FORMAT` | 422 | đã cài | Sai định dạng hoặc dung lượng tệp |
        | `UNSAFE_CONTENT` | 422 | đã cài | Nội dung không an toàn |
        | `AI_GENERATION_TIMEOUT` | 504 | đã cài | Dịch vụ AI timeout sau khi retry |
        | `INTERNAL_ERROR` | 500 | đã cài | Lỗi không xác định |
        | `CONFLICT` | 409 | chưa cài | Xung đột trạng thái nghiệp vụ |
        | `RATE_LIMITED` | 429 | chưa cài | Vượt giới hạn tần suất; kèm `Retry-After` |
        | `ACCOUNT_LOCKED` | 403 | chưa cài | Tài khoản bị quản trị viên khoá |
        | `LOGIN_TEMPORARILY_LOCKED` | 429 | chưa cài | Đăng nhập sai quá 5 lần, khoá 15 phút |
        | `CONTENT_NOT_AGE_APPROPRIATE` | 422 | chưa cài | Nội dung chưa phù hợp lứa tuổi |
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - FILE_TOO_LARGE_OR_INVALID_FORMAT
        - UNSAFE_CONTENT
        - AI_GENERATION_TIMEOUT
        - INTERNAL_ERROR
        - CONFLICT
        - RATE_LIMITED
        - ACCOUNT_LOCKED
        - LOGIN_TEMPORARILY_LOCKED
        - CONTENT_NOT_AGE_APPROPRIATE

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Câu tiếng Việt sẵn sàng hiển thị cho người dùng.
          examples: [Dữ liệu không hợp lệ]
        details:
          type: object
          description: Tuỳ chọn, bỏ qua khi không có.
          properties:
            fields:
              type: array
              description: Lỗi theo từng trường.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    examples: [email]
                  message:
                    type: string
                    examples: [Email không hợp lệ]
            suggestions:
              type: array
              description: Gợi ý điều chỉnh nội dung (chỉ với `CONTENT_NOT_AGE_APPROPRIATE`).
              items:
                type: object

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { const: false }
        error:
          $ref: '#/components/schemas/ErrorBody'

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      description: |
        8 đến 72 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt; tối đa 72 byte UTF-8.
      examples: [Abcd@1234]

    Role:
      type: string
      enum: [ROLE_TEACHER, ROLE_ADMIN]

    RegisterRequest:
      type: object
      required: [fullName, email, password, acceptedPolicy]
      properties:
        fullName:
          type: string
          maxLength: 255
          examples: [Nguyễn Văn A]
        email:
          type: string
          format: email
          maxLength: 255
          examples: [a@school.edu.vn]
        password:
          $ref: '#/components/schemas/Password'
        school:
          type: string
          maxLength: 255
          description: Tuỳ chọn (chờ nhóm xác nhận; entity `Teacher` chưa có trường này).
          examples: [Trường Tiểu học ABC]
        acceptedPolicy:
          type: boolean
          const: true
          description: Phải là `true` (UC-01 4c, đã đọc chính sách bảo vệ dữ liệu cá nhân).

    RegisterResult:
      type: object
      required: [teacherId, email]
      properties:
        teacherId:
          type: string
          format: uuid
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        rememberMe:
          type: boolean
          default: false
          description: Kéo dài refresh token và cookie lên 30 ngày.

    TeacherInfo:
      type: object
      required: [teacherId, fullName, email, role]
      description: |
        Khoá được giữ tên `teacher` để không phá code đã cài, kể cả khi người dùng là quản trị
        viên (`role` cho biết vai trò, Frontend chuyển màn hình chính theo `role`).
      properties:
        teacherId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    AuthData:
      type: object
      required: [accessToken, expiresIn, teacher]
      properties:
        accessToken:
          type: string
          description: JWT.
        expiresIn:
          type: integer
          description: Thời hạn access token, tính bằng giây.
          examples: [900]
        teacher:
          $ref: '#/components/schemas/TeacherInfo'

    Subject:
      type: string
      enum: [MATH, VIETNAMESE, ENGLISH]

    GradeLevel:
      type: string
      enum: [KINDERGARTEN, GRADE_1, GRADE_2, GRADE_3, GRADE_4, GRADE_5]

    GameType:
      type: string
      enum:
        - QUIZ
        - AUDIO_VISUAL_MATCH
        - ODD_ONE_OUT
        - SPOT_THE_TARGET
        - WORD_SCRAMBLE
        - MATCHING
        - MEMORY_CARD
        - DRAG_DROP
        - ORDERING
        - VISUAL_CLOZE

    GameStatus:
      type: string
      enum: [DRAFT, PUBLISHED]

    Voice:
      type: object
      description: Giọng đọc (FLD-12). Mặc định Bắc/Nữ.
      properties:
        region:
          type: string
          enum: [NORTH, CENTRAL, SOUTH]
          default: NORTH
        gender:
          type: string
          enum: [MALE, FEMALE]
          default: FEMALE

    GenerateGameRequest:
      type: object
      required: [subject, gradeLevel]
      description: |
        Phải có ít nhất một trong `idea`, `randomTopic` (hoặc `file` khi dùng multipart); Backend
        kiểm tra điều này (không biểu diễn bằng `anyOf` vì tệp nằm ngoài schema JSON).
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        gradeLevel:
          $ref: '#/components/schemas/GradeLevel'
        idea:
          type: string
          minLength: 10
          maxLength: 2000
          description: Mô tả ý tưởng (FLD-03).
          examples: [Trò chơi đếm số lượng con vật cho học sinh lớp 1]
        randomTopic:
          type: boolean
          description: |
            `true` khi giáo viên chỉ chọn khối lớp và môn rồi bấm "Tạo ngẫu nhiên" (UC-02 3b);
            server tự đề xuất chủ đề phù hợp lứa tuổi.
        gameType:
          $ref: '#/components/schemas/GameType'
        voice:
          $ref: '#/components/schemas/Voice'

    # --- DSL v1.0.0 (nguồn sự thật: JSON Schema trong backend, mỗi loại game một file) ---

    GameEnvelope:
      description: |
        Envelope DSL v1.0.0, chọn nhánh theo `gameType`. Tham chiếu thẳng các JSON Schema của Backend
        (`backend/src/main/resources/schema/game-dsl/1.0.0/*.schema.json`) để không viết hai lần.
        Dùng làm body của `PUT /games/{gameId}` và `POST /games/{gameId}/publish`.
      oneOf:
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/quiz.schema.json'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/audio-visual-match.schema.json'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/odd-one-out.schema.json'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/spot-the-target.schema.json'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/word-scramble.schema.json'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/matching.schema.json'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/memory-card.schema.json'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/drag-drop.schema.json'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/ordering.schema.json'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/visual-cloze.schema.json'

    Question:
      description: Một câu hỏi theo DSL v1.0.0, cấu trúc phụ thuộc `gameType` (dạng đầy đủ cho giáo viên).
      oneOf:
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/quiz.schema.json#/$defs/question'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/audio-visual-match.schema.json#/$defs/question'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/odd-one-out.schema.json#/$defs/question'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/spot-the-target.schema.json#/$defs/question'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/word-scramble.schema.json#/$defs/question'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/matching.schema.json#/$defs/question'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/memory-card.schema.json#/$defs/question'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/drag-drop.schema.json#/$defs/question'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/ordering.schema.json#/$defs/question'
        - $ref: '../../backend/src/main/resources/schema/game-dsl/1.0.0/visual-cloze.schema.json#/$defs/question'

    GameResponse:
      type: object
      required:
        - gameId
        - status
        - updatedAt
        - schemaVersion
        - gameType
        - metadata
        - gameplaySettings
        - questions
      description: |
        Envelope DSL cộng ba trường quản lý ở ngoài cùng (`gameId, status, updatedAt`). Với bản nháp
        SPOT_THE_TARGET, `hitRegion` của câu hỏi có thể vắng mặt (giáo viên chạm ảnh để chọn sau).
        Dạng dành cho học sinh (bỏ đáp án, đã xáo) sẽ mô tả ở nhóm Sessions.
      properties:
        gameId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/GameStatus'
        updatedAt:
          type: string
          format: date-time
        schemaVersion:
          const: '1.0.0'
        gameType:
          $ref: '#/components/schemas/GameType'
        metadata:
          type: object
          required: [title, subject, gradeLevel, topic]
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 100
            subject:
              $ref: '#/components/schemas/Subject'
            gradeLevel:
              $ref: '#/components/schemas/GradeLevel'
            topic:
              type: string
              minLength: 1
              maxLength: 200
        gameplaySettings:
          type: object
          required: [hitboxScale]
          properties:
            hitboxScale:
              type: number
              exclusiveMinimum: 0
              maximum: 3
              examples: [1.5]
        questions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Question'

    GameResult:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data:
          $ref: '#/components/schemas/GameResponse'

    GameSummary:
      type: object
      description: Rút gọn, KHÔNG kèm `questions[]`.
      required: [gameId, title, gameType, subject, gradeLevel, status, updatedAt]
      properties:
        gameId:
          type: string
          format: uuid
        title:
          type: string
          description: Lấy từ `metadata.title`.
        gameType:
          $ref: '#/components/schemas/GameType'
        subject:
          $ref: '#/components/schemas/Subject'
        gradeLevel:
          $ref: '#/components/schemas/GradeLevel'
        status:
          $ref: '#/components/schemas/GameStatus'
        shareCode:
          type: [string, 'null']
          description: 6 ký tự chữ và số; `null` khi game còn `DRAFT`.
          examples: [A3F9K2]
        shareUrl:
          type: [string, 'null']
          format: uri
          description: '`null` khi game còn `DRAFT`.'
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          description: |
            Backend suy ra từ `imageUrl` của câu hỏi đầu tiên; `null` nếu câu đó không có ảnh
            (Frontend hiển thị biểu tượng theo `gameType`).
        updatedAt:
          type: string
          format: date-time

    PublishResult:
      type: object
      required: [gameId, status, shareCode, shareUrl]
      properties:
        gameId:
          type: string
          format: uuid
        status:
          const: PUBLISHED
        shareCode:
          type: string
          examples: [A3F9K2]
        shareUrl:
          type: string
          format: uri

    # --- Sessions / Play ---

    SessionType:
      type: string
      description: |
        `SOLO`: Live Arena cá nhân (UC-09). `TEAM`: Live Arena thi đấu nhóm. `SELF`: tự luyện tại nhà,
        không cần giáo viên (UC-08), bắt đầu ở `ACTIVE`, hết hạn sau 24 giờ.
      enum: [SOLO, TEAM, SELF]

    SessionStatus:
      type: string
      enum: [WAITING, ACTIVE, PAUSED, CLOSED]

    ParticipantStatus:
      type: string
      description: |
        `JOINED` (đã vào, chưa trả lời), `PLAYING`, `COMPLETED` (đã trả lời hết), `ENDED` (phiên đóng
        lúc chưa hoàn thành).
      enum: [JOINED, PLAYING, COMPLETED, ENDED]

    InteractionStatus:
      type: string
      enum: [CORRECT, INCORRECT, SKIPPED, TIMEOUT]

    GroupingStrategy:
      type: string
      enum: [RANDOM, MANUAL_ASSIGN, FREE_CHOICE]

    TeamInfo:
      type: object
      required: [teamId, teamName, teamColor]
      properties:
        teamId:
          type: string
          format: uuid
        teamName:
          type: string
          examples: [Đội Sao]
        teamColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          examples: ['#F59E0B']

    TeamInput:
      type: object
      required: [teamName, teamColor]
      properties:
        teamName:
          type: string
        teamColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'

    CreateSessionRequest:
      type: object
      properties:
        sessionName:
          type: string
          examples: [Lớp 1A - tiết 3]
        sessionType:
          type: string
          enum: [SOLO, TEAM]
          default: SOLO
        maxParticipants:
          type: integer
          minimum: 1
          description: Bỏ qua nghĩa là không giới hạn.
        groupingStrategy:
          allOf:
            - $ref: '#/components/schemas/GroupingStrategy'
          default: RANDOM
          description: Chỉ với `TEAM`.
        teams:
          type: array
          minItems: 2
          maxItems: 6
          description: Chỉ với `TEAM`. Bỏ qua thì tạo "Đội 1", "Đội 2" với màu mặc định.
          items:
            $ref: '#/components/schemas/TeamInput'

    CreateSessionResult:
      type: object
      required: [sessionId, sessionType, accessCode, joinUrl, status]
      properties:
        sessionId:
          type: string
          format: uuid
        sessionType:
          $ref: '#/components/schemas/SessionType'
        accessCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: Mã PIN 6 chữ số, duy nhất trong các phiên chưa kết thúc.
          examples: ['482913']
        joinUrl:
          type: string
          format: uri
          description: Để Frontend vẽ mã QR.
        status:
          const: WAITING
        teams:
          type: array
          description: Chỉ có ở phiên `TEAM`.
          items:
            $ref: '#/components/schemas/TeamInfo'

    SessionByCode:
      type: object
      required: [sessionId, gameTitle, sessionType, status]
      properties:
        sessionId:
          type: string
          format: uuid
        gameTitle:
          type: string
        sessionType:
          $ref: '#/components/schemas/SessionType'
        status:
          $ref: '#/components/schemas/SessionStatus'
        groupingStrategy:
          $ref: '#/components/schemas/GroupingStrategy'
        teams:
          type: array
          description: '`groupingStrategy` và `teams` chỉ có ở `TEAM`.'
          items:
            $ref: '#/components/schemas/TeamInfo'

    JoinRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
          examples: [Bé An]
        teamId:
          type: string
          format: uuid
          description: Chỉ dùng ở `TEAM` với `FREE_CHOICE`, bắt buộc trong trường hợp đó.

    JoinResult:
      type: object
      required: [participantId, nickname, sessionStatus]
      properties:
        participantId:
          type: string
          format: uuid
          description: Từ đây mỗi request của học sinh gửi header `X-Participant-Id`.
        nickname:
          type: string
        sessionStatus:
          $ref: '#/components/schemas/SessionStatus'
        team:
          description: |
            Với `TEAM`: đội khi đã có (`FREE_CHOICE`), ngược lại `null` đến khi giáo viên xếp hoặc server
            chia lúc `start`.
          oneOf:
            - $ref: '#/components/schemas/TeamInfo'
            - type: 'null'

    TeamAssignRequest:
      type: object
      required: [teamId]
      properties:
        teamId:
          type: string
          format: uuid

    StudentGameResponse:
      type: object
      required: [schemaVersion, gameType, metadata, gameplaySettings, questions, answeredQuestionIds]
      description: |
        Dạng dành cho học sinh của `GameResponse`: bỏ `gameId, status, updatedAt`, bỏ trường đáp án, các
        phần tử đã xáo. Biến đổi theo từng loại game xem mô tả của `GET /sessions/{sessionId}/questions`.
        Cấu trúc câu hỏi chưa có schema máy đọc (DSL chưa mô tả dạng học sinh; đây là cam kết ở cấp hợp
        đồng).
      properties:
        schemaVersion:
          const: '1.0.0'
        gameType:
          $ref: '#/components/schemas/GameType'
        metadata:
          type: object
          required: [title, subject, gradeLevel, topic]
          properties:
            title:
              type: string
            subject:
              $ref: '#/components/schemas/Subject'
            gradeLevel:
              $ref: '#/components/schemas/GradeLevel'
            topic:
              type: string
        gameplaySettings:
          type: object
          required: [hitboxScale]
          properties:
            hitboxScale:
              type: number
        questions:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
                examples: [q1]
            additionalProperties: true
        answeredQuestionIds:
          type: array
          description: Để tiếp tục đúng chỗ khi tải lại trang.
          items:
            type: string
          examples:
            - [q1, q2]

    InteractionBase:
      type: object
      required: [questionId, timeSpentMs]
      properties:
        questionId:
          type: string
          examples: [q1]
        timeSpentMs:
          type: integer
          minimum: 0
          description: Do client báo nên có thể bị làm giả; server chặn giá trị ngoài khoảng cho phép.
          examples: [4200]

    InteractionRequest:
      description: |
        Các trường trả lời đặt phẳng trong body. Hợp lệ khi khớp ít nhất một dạng bên dưới và dạng đó
        phải đúng với `gameType` của phiên (Backend kiểm tra; QUIZ và AUDIO_VISUAL_MATCH cùng dùng
        `selectedOptionId` nên dùng `anyOf`, không phải `oneOf`).
      anyOf:
        - title: Hết giờ hoặc bỏ qua
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [TIMEOUT, SKIPPED]
        - title: QUIZ, AUDIO_VISUAL_MATCH
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [selectedOptionId]
              properties:
                selectedOptionId:
                  type: string
                  examples: [a]
        - title: ODD_ONE_OUT
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [selectedItemId]
              properties:
                selectedItemId:
                  type: string
        - title: SPOT_THE_TARGET
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [x, y]
              properties:
                x:
                  type: number
                  minimum: 0
                  maximum: 1
                y:
                  type: number
                  minimum: 0
                  maximum: 1
        - title: MATCHING
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [matches]
              properties:
                matches:
                  type: array
                  items:
                    type: object
                    required: [leftPairId, rightPairId]
                    properties:
                      leftPairId:
                        type: string
                        examples: [l1]
                      rightPairId:
                        type: string
                        examples: [r2]
        - title: MEMORY_CARD
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [matchedPairIds, flips]
              properties:
                matchedPairIds:
                  type: array
                  items:
                    type: string
                flips:
                  type: integer
                  minimum: 0
                  description: Lưu vào `attemptsCount`.
        - title: DRAG_DROP
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [placements]
              properties:
                placements:
                  type: array
                  items:
                    type: object
                    required: [itemId, zoneId]
                    properties:
                      itemId:
                        type: string
                      zoneId:
                        type: string
        - title: VISUAL_CLOZE
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [answer]
              properties:
                answer:
                  type: string
        - title: ORDERING
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [order]
              properties:
                order:
                  type: array
                  description: Các `id` bước theo thứ tự trẻ sắp.
                  items:
                    type: string
        - title: WORD_SCRAMBLE
          allOf:
            - $ref: '#/components/schemas/InteractionBase'
            - type: object
              required: [word]
              properties:
                word:
                  type: string

    InteractionResult:
      type: object
      required: [status, isCorrect, pointsEarned, totalScore]
      properties:
        status:
          $ref: '#/components/schemas/InteractionStatus'
        isCorrect:
          type: boolean
          description: '`true` khi `status` là `CORRECT`.'
        pointsEarned:
          type: integer
          minimum: 0
        totalScore:
          type: integer
          minimum: 0
          description: Điểm cộng dồn của participant.
        correctAnswer:
          type: [object, 'null']
          description: |
            Cùng tên trường với phần trả lời của loại game đó (với SPOT_THE_TARGET là vùng đúng
            `{ x, y, radius }`). Chỉ trả sau khi đã chấm.
          additionalProperties: true
          examples:
            - selectedOptionId: a
        explanation:
          type: [string, 'null']
          description: Lời giải thích/gợi ý sư phạm (FLD-13); `null` cho đến khi DSL bổ sung trường này.

    LeaderboardParticipant:
      type: object
      required: [rank, nickname, score]
      properties:
        rank:
          type: integer
          minimum: 1
        nickname:
          type: string
        score:
          type: integer
        teamId:
          type: [string, 'null']
          format: uuid
        participantId:
          type: string
          format: uuid
          description: Chỉ có trong response gửi cho giáo viên, không bao giờ gửi cho học sinh.

    LeaderboardTeam:
      type: object
      required: [rank, teamId, teamName, teamColor, score, memberCount]
      properties:
        rank:
          type: integer
          minimum: 1
        teamId:
          type: string
          format: uuid
        teamName:
          type: string
        teamColor:
          type: string
        score:
          type: number
          description: Điểm trung bình của các thành viên.
          examples: [62.5]
        memberCount:
          type: integer
          minimum: 0

    Leaderboard:
      type: object
      required: [participants]
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardParticipant'
        teams:
          type: array
          description: Chỉ có ở phiên `TEAM`.
          items:
            $ref: '#/components/schemas/LeaderboardTeam'

    MyResult:
      type: object
      required:
        - participantId
        - nickname
        - status
        - score
        - correctCount
        - incorrectCount
        - totalQuestions
        - answeredCount
      properties:
        participantId:
          type: string
          format: uuid
        nickname:
          type: string
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        score:
          type: integer
        correctCount:
          type: integer
        incorrectCount:
          type: integer
        totalQuestions:
          type: integer
        answeredCount:
          type: integer
        rank:
          type: [integer, 'null']
          description: '`null` ở phiên `SELF`.'
        team:
          description: '`null` ở phiên không phải `TEAM`.'
          oneOf:
            - type: object
              required: [teamId, teamName, teamScore]
              properties:
                teamId:
                  type: string
                  format: uuid
                teamName:
                  type: string
                teamScore:
                  type: number
            - type: 'null'

    SharedGameInfo:
      type: object
      required: [gameTitle, gameType, questionCount]
      properties:
        gameTitle:
          type: string
        gameType:
          $ref: '#/components/schemas/GameType'
        questionCount:
          type: integer
          minimum: 1

    PlayRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
          description: Cùng luật nickname với `join`.

    PlayResult:
      type: object
      required: [sessionId, participantId, nickname, sessionType, status, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        nickname:
          type: string
        sessionType:
          const: SELF
        status:
          const: ACTIVE
        expiresAt:
          type: string
          format: date-time
          description: Nộp câu sau thời điểm này trả 409.

    SessionListItem:
      type: object
      required: [sessionId, sessionType, status, participantCount]
      properties:
        sessionId:
          type: string
          format: uuid
        sessionName:
          type: [string, 'null']
        sessionType:
          $ref: '#/components/schemas/SessionType'
        accessCode:
          type: [string, 'null']
          description: '`null` ở phiên `SELF`.'
        status:
          $ref: '#/components/schemas/SessionStatus'
        participantCount:
          type: integer
          minimum: 0

    SessionDetail:
      type: object
      required: [sessionId, sessionType, status, gameId, participants]
      properties:
        sessionId:
          type: string
          format: uuid
        sessionName:
          type: [string, 'null']
        sessionType:
          $ref: '#/components/schemas/SessionType'
        accessCode:
          type: [string, 'null']
        joinUrl:
          type: [string, 'null']
          format: uri
        status:
          $ref: '#/components/schemas/SessionStatus'
        gameId:
          type: string
          format: uuid
        groupingStrategy:
          $ref: '#/components/schemas/GroupingStrategy'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamInfo'
        participants:
          type: array
          items:
            type: object
            required: [participantId, nickname, status, answeredCount]
            properties:
              participantId:
                type: string
                format: uuid
              nickname:
                type: string
              status:
                $ref: '#/components/schemas/ParticipantStatus'
              answeredCount:
                type: integer
                minimum: 0
              teamId:
                type: [string, 'null']
                format: uuid

    SessionResults:
      type: object
      required: [sessionId, sessionType, status, totalQuestions, participants]
      properties:
        sessionId:
          type: string
          format: uuid
        sessionType:
          $ref: '#/components/schemas/SessionType'
        status:
          $ref: '#/components/schemas/SessionStatus'
        totalQuestions:
          type: integer
        participants:
          type: array
          description: Sắp xếp theo `score` giảm dần.
          items:
            type: object
            required: [participantId, nickname, status, score, correctCount, incorrectCount, timeoutCount]
            properties:
              participantId:
                type: string
                format: uuid
              nickname:
                type: string
              status:
                $ref: '#/components/schemas/ParticipantStatus'
              score:
                type: integer
              correctCount:
                type: integer
              incorrectCount:
                type: integer
              timeoutCount:
                type: integer
              completedAt:
                type: [string, 'null']
                format: date-time
                description: '`null` nếu chưa hoàn thành.'
              teamId:
                type: [string, 'null']
                format: uuid
        teams:
          type: array
          description: Chỉ có ở `TEAM`.
          items:
            type: object
            required: [teamId, teamName, score, memberCount]
            properties:
              teamId:
                type: string
                format: uuid
              teamName:
                type: string
              score:
                type: number
              memberCount:
                type: integer

    ParticipantInteraction:
      type: object
      required: [questionId, status, pointsEarned, timeSpentMs]
      properties:
        questionId:
          type: string
        status:
          $ref: '#/components/schemas/InteractionStatus'
        pointsEarned:
          type: integer
        timeSpentMs:
          type: integer
        attemptsCount:
          type: integer
        answer:
          type: object
          description: Phần trả lời của học sinh, cùng tên trường với `InteractionRequest`.
          additionalProperties: true
        correctAnswer:
          type: object
          description: Đáp án đúng, cùng tên trường với `answer`.
          additionalProperties: true

    # --- Admin ---

    PageInfo:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    TeacherAccountStatus:
      type: string
      enum: [ACTIVE, LOCKED]

    AdminTeacher:
      type: object
      required: [teacherId, fullName, email, status, createdAt]
      properties:
        teacherId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        school:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TeacherAccountStatus'
        createdAt:
          type: string
          format: date-time

    AdminCreateTeacherRequest:
      type: object
      required: [fullName, email, initialPassword]
      properties:
        fullName:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        school:
          type: string
          maxLength: 255
        initialPassword:
          $ref: '#/components/schemas/Password'

    AuditResult:
      type: string
      enum: [SUCCESS, FAILURE, BLOCKED]

    AuditLogEntry:
      type: object
      required: [logId, timestamp, actorId, actorRole, action, result]
      properties:
        logId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        actorRole:
          $ref: '#/components/schemas/Role'
        ip:
          type: [string, 'null']
        action:
          type: string
          examples: [POST /api/games/generate]
        result:
          $ref: '#/components/schemas/AuditResult'
        moderationResult:
          type: [string, 'null']

    ServiceName:
      type: string
      enum: [GENERATIVE_AI, IMAGE_API, TTS, MODERATION]

    ServiceUsage:
      type: object
      required: [service, requests, successCount, failureCount, costSource, status]
      properties:
        service:
          $ref: '#/components/schemas/ServiceName'
        requests:
          type: integer
        successCount:
          type: integer
        failureCount:
          type: integer
        tokensUsed:
          type: [integer, 'null']
        quotaUsedPercent:
          type: [number, 'null']
        cost:
          type: [number, 'null']
          description: '`null` khi `costSource` là `UNAVAILABLE`.'
        costCurrency:
          type: [string, 'null']
          examples: [USD]
        costSource:
          type: string
          description: |
            `BILLING` (số liệu nhà cung cấp), `ESTIMATED` (tính từ lượng dùng và bảng giá đã cấu hình),
            `UNAVAILABLE`.
          enum: [BILLING, ESTIMATED, UNAVAILABLE]
        status:
          type: string
          description: '`UNREACHABLE` hiển thị "Không thể kết nối", `UNKNOWN` hiển thị "Chưa xác định trạng thái".'
          enum: [OPERATIONAL, UNREACHABLE, UNKNOWN]

    UsageReport:
      type: object
      required: [range, services, timeseries]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceUsage'
        timeseries:
          type: array
          items:
            type: object
            required: [date, requests]
            properties:
              date:
                type: string
                format: date
              requests:
                type: integer
              cost:
                type: [number, 'null']

    SystemStatus:
      type: object
      properties:
        server:
          type: object
          properties:
            cpuUsagePercent:
              type: number
            heapUsagePercent:
              type: number
            activeThreads:
              type: integer
        database:
          type: object
          properties:
            poolUsagePercent:
              type: number
        liveArena:
          type: object
          properties:
            activeSessions:
              type: integer
            connectedClients:
              type: integer

    AiConfigInput:
      type: object
      required: [systemPrompt]
      properties:
        systemPrompt:
          type: string
          minLength: 1
        temperature:
          type: number
          minimum: 0
          maximum: 1
          default: 0.3
        maxTokens:
          type: integer
          minimum: 500
          maximum: 4000
          default: 2000
        moderationThreshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.85

    AiConfigVersion:
      allOf:
        - $ref: '#/components/schemas/AiConfigInput'
        - type: object
          required: [versionId, frozen, active, sha256, createdAt, createdBy]
          properties:
            versionId:
              type: string
              format: uuid
            label:
              type: [string, 'null']
              examples: [v1.0.0]
            frozen:
              type: boolean
            active:
              type: boolean
            sha256:
              type: string
              description: Do server tính (NFR-05).
              examples: [ab12cd34]
            createdAt:
              type: string
              format: date-time
            createdBy:
              type: string
              format: uuid

    BlockedWords:
      type: object
      required: [words]
      properties:
        words:
          type: array
          items:
            type: string
