        | SPOT_THE_TARGET | Bỏ `hitRegion`; giữ `targetDescription`, `imageUrl` |
        | WORD_SCRAMBLE | Bỏ `correctWord`; giữ `scrambledLetters` |
        | MATCHING | Tách `leftItems` và `rightItems` đã xáo, **cả hai bên dùng mã mờ** (`l1, l2...` và `r1, r2...`), không dùng `pairId` thật; bỏ `pairs` |
        | MEMORY_CARD | Giữ nguyên `pairs` (không có bí mật); Frontend nhân đôi và xáo thẻ |
        | DRAG_DROP | Giữ `dropZones`; bỏ `targetZoneId` ở từng vật |
        | ORDERING | Bỏ `correctPosition`; thứ tự mảng `steps` là thứ tự hiển thị đã xáo |
        | VISUAL_CLOZE | Bỏ `correctAnswer`; thay `distractors` bằng `options: [chuỗi]` đã xáo (đáp án đúng và gây nhiễu) |

        Thứ tự xáo và mã mờ được sinh **xác định** từ HMAC (khoá bí mật của server, `sessionId`,
        `questionId`): tải lại vẫn ra cùng thứ tự, Backend không cần lưu ánh xạ.
      x-status: planned
      security:
        - participantId: []
      responses:
        '200':
          description: Câu hỏi dạng học sinh.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    $ref: '#/components/schemas/StudentGameResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
