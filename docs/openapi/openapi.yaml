  /sessions/{sessionId}/interactions:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Play]
      operationId: submitInteraction
      summary: Nộp một câu trả lời
      description: |
        Các trường trả lời đặt **phẳng** trong body (đúng DSL mục 5 và 10), cùng `questionId` và
        `timeSpentMs`. Hết giờ hoặc bỏ qua: không gửi trường trả lời, thay bằng `"outcome": "TIMEOUT"`
        hoặc `"SKIPPED"`. Server tự biết loại game từ phiên nên không gửi `gameType`.

        | Loại game | Trường trả lời | Đúng khi |
        |---|---|---|
        | QUIZ | `selectedOptionId` | Trùng đáp án |
        | AUDIO_VISUAL_MATCH | `selectedOptionId` (id do Backend cấp ở dạng học sinh) | Chọn đúng hình |
        | ODD_ONE_OUT | `selectedItemId` | Chọn đúng phần tử khác loại |
        | SPOT_THE_TARGET | `x`, `y` (0 đến 1) | Khoảng cách tới tâm `hitRegion` không vượt `radius` |
        | MATCHING | `matches: [{ leftPairId, rightPairId }]` (mã mờ của dạng học sinh) | Mọi cặp nối đúng |
        | MEMORY_CARD | `matchedPairIds: [...]`, `flips` | Tìm đủ mọi cặp; `flips` lưu vào `attemptsCount` |
        | DRAG_DROP | `placements: [{ itemId, zoneId }]` | Mọi vật vào đúng vùng |
        | VISUAL_CLOZE | `answer` | Trùng đáp án sau khi chuẩn hoá chữ hoa/thường và khoảng trắng |
        | ORDERING | `order: [id, ...]` | Thứ tự khớp thứ tự đúng |
        | WORD_SCRAMBLE | `word` | Trùng `correctWord` (chuẩn hoá như trên) |

        Điểm tính theo FLD-16: `ratio` = giới hạn trong [0, 1] của `timeSpentMs / (timeLimitSeconds × 1000)`;
        `pointsEarned = làm tròn(points × (1 − 0.5 × ratio))` khi `CORRECT`, ngược lại 0. Vượt giới hạn
        cộng 1 giây dung sai thì coi là `TIMEOUT`. Chấm đúng/sai theo kiểu đúng hết hoặc không. Hệ số
        0.5 là hằng số cấu hình, không nằm trong API.

        `correctAnswer` chỉ trả **sau khi đã chấm**, để trẻ được chỉ cho thấy đáp án đúng (quy ước UX).

        **Gửi lại cùng cặp (participant, `questionId`)** trả 200 với kết quả đã lưu, không tạo bản ghi
        mới, không cộng điểm lần hai. Phiên không ở trạng thái `ACTIVE` (hoặc sau `expiresAt` ở phiên
        `SELF`) trả 409.
      x-status: planned
      security:
        - participantId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
      responses:
        '200':
          description: Kết quả chấm.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    $ref: '#/components/schemas/InteractionResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

