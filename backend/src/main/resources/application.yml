spring:
  application:
    name: aigame-backend

  datasource:
    # Supabase (managed PostgreSQL) — use Session Pooler or Direct Connection.
    # Do NOT use the Transaction Pooler (port 6543): it is not compatible with
    # Hibernate's prepared statement caching.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase free tier caps concurrent connections, keep the pool small.
      maximum-pool-size: 5

  jpa:
    hibernate:
      # Schema is managed by Flyway, never let Hibernate auto-generate DDL.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase's "public" schema is never empty, so Flyway needs a baseline.
    # baseline-version 0 makes sure V1 and V2 are still applied.
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    # HS256 signing key, at least 32 bytes. Provide it via the JWT_SECRET environment variable.
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-hours: 24
  auth:
    refresh-cookie:
      name: refresh_token
      path: /api/auth
      same-site: Strict
      # Secure cookies need HTTPS in production; browsers still accept them on http://localhost.
      secure: ${COOKIE_SECURE:true}
