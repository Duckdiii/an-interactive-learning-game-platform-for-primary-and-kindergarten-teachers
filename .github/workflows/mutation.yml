# Path-filtered check: do not require it for PRs outside this scope.
name: mutation-validation
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/src/main/java/com/aigameplatform/backend/service/validation/**'
      - 'backend/src/test/java/com/aigameplatform/backend/service/validation/**'
      - 'backend/pom.xml'
      - '.github/workflows/mutation.yml'
permissions:
  contents: read
jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pit-validation
          path: backend/target/pit-reports
          retention-days: 14
