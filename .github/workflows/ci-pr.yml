# ci-pr: chạy trên mỗi PR nhắm vào main. 3 job độc lập, chạy song song.
# - backend-test: 447 unit test + AigameBackendApplicationTests (khởi động thật, chạy Flyway trên Supabase thật
#   của dự án — cần 5 secret bên dưới) + JaCoCo (chặn nếu LINE coverage < 70%, xem backend/pom.xml).
# - frontend-build: lint (oxlint) + test (Vitest) + build (gồm type-check TypeScript).
# - secret-scan: Gitleaks quét toàn bộ diff của PR, tìm secret bị commit nhầm.
#
# Còn thiếu so với sơ đồ CI/CD gốc (để làm sau, cần thêm tài khoản/hạ tầng):
# - SonarCloud (cần tài khoản) — khi có, gộp luôn phần "lint backend" vào đó.
# - Docker build, deploy staging/production — chưa có Dockerfile, chưa có server staging/production.

name: ci-pr

on:
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests (unit test + Layer 1-3 + khởi động thật trên Supabase)
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./mvnw --batch-mode test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          retention-days: 14

  frontend-build:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
