# ci-pr: chạy trên mỗi PR nhắm vào main hoặc dev. 4 job độc lập, chạy song song.
# - backend-test: toàn bộ test backend (unit test, ArchitectureRulesTest, AigameBackendApplicationTests) + JaCoCo
#   (chặn nếu LINE coverage < 70%, xem backend/pom.xml). AigameBackendApplicationTests khởi động context trên H2 trong
#   bộ nhớ (profile test: Flyway tắt, ddl-auto none), nên CHƯA kiểm migration hay entity khớp schema Supabase thật;
#   các test *LiveTest gọi DB/AI thật chỉ chạy khi đặt biến RUN_LIVE_*. TeacherFlowVerificationTest chạy luồng giáo
#   viên qua HTTP với AI giả (H2, schema do Hibernate tạo), bằng chứng tải lên artifact verify-flow-evidence.
# - frontend-build: lint (oxlint) + test (Vitest) + build (gồm type-check TypeScript).
# - secret-scan: Gitleaks quét toàn bộ diff của PR, tìm secret bị commit nhầm.
# - docs-scripts: log AI không quá dài và đúng định dạng, migration Flyway không bị sửa so với base, cấu hình dùng
#   chung không có giá trị nguy hiểm, và docs/openapi/INDEX.md còn mới.
#
# Còn thiếu so với sơ đồ CI/CD gốc (để làm sau, cần thêm tài khoản/hạ tầng):
# - SonarCloud (cần tài khoản) — khi có, gộp luôn phần "lint backend" vào đó.
# - Docker build, deploy staging/production — chưa có Dockerfile, chưa có server staging/production.

name: ci-pr

on:
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    name: Backend test (JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests (unit test + Layer 1-3 + ArchUnit + khởi động context trên H2)
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # PR của Dependabot không nhận Actions secret; không thêm secret cho Dependabot vì code của gói bên thứ ba chạy
        # trong job này. Không cần loại test nào: mọi test không gắn RUN_LIVE_* chạy trên H2 (profile test), đã kiểm khi
        # bỏ hết secret (AigameBackendApplicationTests, TeacherFlowVerificationTest đều xanh).
        run: ./mvnw --batch-mode test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          retention-days: 14

      # Bằng chứng từng bước của TeacherFlowVerificationTest (luồng giáo viên qua HTTP, AI giả, token đã che).
      - name: Upload verify-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-flow-evidence
          path: backend/target/verify-evidence
          retention-days: 14
          if-no-files-found: warn

  frontend-build:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Chỉ trên CI: giới hạn số luồng vitest (máy chạy CI ít nhân nên nhiều luồng làm test thời gian chập chờn, xem mục Nợ và rủi ro trong "docs/wiki/Kế hoạch và việc còn lại.md").
      # Chạy cục bộ vẫn dùng mặc định của vite.config.ts.
      - run: npm run test -- --maxWorkers=2
      - run: npm run build

  docs-scripts:
    name: Log AI và chỉ mục OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-migrations cần lịch sử để tìm merge-base với nhánh base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      # Lỗi ở đây nghĩa là quên chạy: node scripts/ai-log/rotate.mjs hoặc node scripts/openapi/build-index.mjs
      - run: node scripts/ai-log/rotate.mjs --check
      - run: node scripts/ai-log/check-ai-usage-log.mjs
      - run: node scripts/db/check-migrations.mjs --base "origin/${{ github.base_ref }}"
      - run: node scripts/hooks/check-config.mjs --tracked
      - run: >-
          node --test scripts/ai-log/rotate.test.mjs scripts/openapi/build-index.test.mjs
          scripts/ai-log/check-ai-usage-log.test.mjs scripts/db/check-migrations.test.mjs scripts/hooks/check-config.test.mjs

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
