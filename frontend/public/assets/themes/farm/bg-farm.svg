<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Layer 0: Sky & Sun -->
    <linearGradient id="farmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#BAE6FD"/>
      <stop offset="85%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Layer 1: Hills & Barn -->
    <linearGradient id="hillFarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="hillMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Layer 2: Foreground Lawn & Fence -->
    <linearGradient id="farmLawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="woodPost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="barnRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- ================= LAYER 0: SKY, SUN & CLOUDS ================= -->
  <g id="layer0-sky">
    <!-- Sky Background -->
    <rect width="1920" height="1080" fill="url(#farmSky)"/>

    <!-- Radiant Glowing Sun (Upper Right) -->
    <circle cx="1560" cy="220" r="140" fill="url(#sunGlow)"/>
    <circle cx="1560" cy="220" r="64" fill="#FDE047" stroke="#F59E0B" stroke-width="4"/>

    <!-- Soft Sun Rays -->
    <g stroke="#FEF08A" stroke-width="6" stroke-linecap="round" opacity="0.6">
      <line x1="1560" y1="120" x2="1560" y2="80"/>
      <line x1="1560" y1="320" x2="1560" y2="360"/>
      <line x1="1460" y1="220" x2="1420" y2="220"/>
      <line x1="1660" y1="220" x2="1700" y2="220"/>
      <line x1="1490" y1="150" x2="1460" y2="120"/>
      <line x1="1630" y1="290" x2="1660" y2="320"/>
      <line x1="1490" y1="290" x2="1460" y2="320"/>
      <line x1="1630" y1="150" x2="1660" y2="120"/>
    </g>

    <!-- Puffy Cartoon Clouds -->
    <!-- Cloud 1 (Left) -->
    <g transform="translate(180, 140)" fill="#FFFFFF" opacity="0.95">
      <circle cx="60" cy="60" r="45"/>
      <circle cx="110" cy="40" r="55"/>
      <circle cx="170" cy="50" r="45"/>
      <circle cx="210" cy="65" r="35"/>
      <rect x="60" y="60" width="150" height="40" rx="10"/>
    </g>

    <!-- Cloud 2 (Center-Right) -->
    <g transform="translate(880, 190)" fill="#FFFFFF" opacity="0.9">
      <circle cx="50" cy="50" r="35"/>
      <circle cx="90" cy="35" r="45"/>
      <circle cx="140" cy="45" r="38"/>
      <rect x="50" y="50" width="90" height="32" rx="10"/>
    </g>
  </g>

  <!-- ================= LAYER 1: ROLLING HILLS, WINDMILL & BARN ================= -->
  <g id="layer1-midground">
    <!-- Distant Mountain/Hill Range -->
    <path d="M-50,650 Q300,520 750,600 T1600,560 Q1780,570 2000,620 L2000,1080 L-50,1080 Z" fill="url(#hillFarGrad)"/>

    <!-- Midground Hill -->
    <path d="M-50,720 Q420,610 980,680 T1980,640 L1980,1080 L-50,1080 Z" fill="url(#hillMidGrad)"/>

    <!-- Distant Windmill (Left Hill) -->
    <g transform="translate(320, 500)">
      <!-- Windmill Body -->
      <polygon points="40,160 55,60 85,60 100,160" fill="#F8FAFC" stroke="#64748B" stroke-width="3"/>
      <polygon points="50,60 70,30 90,60" fill="#EA580C" stroke="#9A3412" stroke-width="3"/>
      <!-- Windmill Center Pin & Blades -->
      <circle cx="70" cy="60" r="6" fill="#475569"/>
      <line x1="70" y1="60" x2="30" y2="20" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
      <line x1="70" y1="60" x2="110" y2="100" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
      <line x1="70" y1="60" x2="30" y2="100" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
      <line x1="70" y1="60" x2="110" y2="20" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Distant Red Barn (Right Hill) -->
    <g transform="translate(1380, 520)">
      <!-- Main Barn Structure -->
      <polygon points="30,150 30,70 80,30 130,70 130,150" fill="url(#barnRed)" stroke="#7F1D1D" stroke-width="3"/>
      <polygon points="25,70 80,25 135,70" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <!-- Barn Door with X Cross -->
      <rect x="60" y="100" width="40" height="50" fill="#FEF2F2" stroke="#7F1D1D" stroke-width="2"/>
      <line x1="60" y1="100" x2="100" y2="150" stroke="#DC2626" stroke-width="2"/>
      <line x1="100" y1="100" x2="60" y2="150" stroke="#DC2626" stroke-width="2"/>
      <!-- Silo beside barn -->
      <rect x="138" y="60" width="30" height="90" rx="6" fill="#CBD5E1" stroke="#475569" stroke-width="3"/>
      <ellipse cx="153" cy="60" rx="15" ry="12" fill="#94A3B8" stroke="#475569" stroke-width="3"/>
    </g>

    <!-- Round Trees on Hills -->
    <g transform="translate(740, 590)">
      <rect x="25" y="50" width="10" height="35" fill="#78350F" rx="3"/>
      <circle cx="30" cy="40" r="30" fill="#15803D" stroke="#14532D" stroke-width="3"/>
      <circle cx="22" cy="32" r="8" fill="#4ADE80" opacity="0.6"/>
    </g>
    <g transform="translate(810, 610)">
      <rect x="20" y="40" width="8" height="30" fill="#78350F" rx="2"/>
      <circle cx="24" cy="32" r="24" fill="#16A34A" stroke="#14532D" stroke-width="3"/>
    </g>
  </g>

  <!-- ================= LAYER 2: FOREGROUND LAWN, WOODEN FENCE & FLOWERS ================= -->
  <g id="layer2-foreground">
    <!-- Rolling Foreground Meadow with Candy Outline -->
    <path d="M-50,810 Q380,730 880,790 T1980,760 L1980,1080 L-50,1080 Z" fill="url(#farmLawn)" stroke="#14532D" stroke-width="5"/>

    <!-- Wooden Post Fence Spanning across Lawn -->
    <g stroke="#78350F" stroke-linejoin="round">
      <!-- Horizontal Rails -->
      <path d="M-20,830 Q460,780 960,820 T1960,800" fill="none" stroke="url(#woodPost)" stroke-width="14" stroke-linecap="round"/>
      <path d="M-20,875 Q460,825 960,865 T1960,845" fill="none" stroke="url(#woodPost)" stroke-width="14" stroke-linecap="round"/>

      <!-- Vertical Fence Posts with Pointed Caps -->
      <!-- Post 1 -->
      <polygon points="120,780 135,760 150,780 150,910 120,910" fill="url(#woodPost)" stroke-width="3"/>
      <!-- Post 2 -->
      <polygon points="420,770 435,750 450,770 450,900 420,900" fill="url(#woodPost)" stroke-width="3"/>
      <!-- Post 3 -->
      <polygon points="720,775 735,755 750,775 750,905 720,905" fill="url(#woodPost)" stroke-width="3"/>
      <!-- Post 4 -->
      <polygon points="1040,785 1055,765 1070,785 1070,915 1040,915" fill="url(#woodPost)" stroke-width="3"/>
      <!-- Post 5 -->
      <polygon points="1380,780 1395,760 1410,780 1410,910 1380,910" fill="url(#woodPost)" stroke-width="3"/>
      <!-- Post 6 -->
      <polygon points="1700,770 1715,750 1730,770 1730,900 1700,900" fill="url(#woodPost)" stroke-width="3"/>
    </g>

    <!-- Cheerful Sunflowers by Fence (Left) -->
    <g transform="translate(220, 780)">
      <path d="M50,150 Q45,70 50,0" stroke="#15803D" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- Leaves -->
      <path d="M48,80 Q20,60 15,90 C25,95 45,90 48,80 Z" fill="#22C55E" stroke="#14532D" stroke-width="3"/>
      <path d="M52,50 Q80,30 85,60 C75,65 55,60 52,50 Z" fill="#22C55E" stroke="#14532D" stroke-width="3"/>
      <!-- Sunflower Petals -->
      <g fill="#FBBF24" stroke="#D97706" stroke-width="3">
        <circle cx="50" cy="0" r="48" fill="#FDE047"/>
        <circle cx="50" cy="-35" r="14"/>
        <circle cx="50" cy="35" r="14"/>
        <circle cx="15" cy="0" r="14"/>
        <circle cx="85" cy="0" r="14"/>
        <circle cx="25" cy="-25" r="14"/>
        <circle cx="75" cy="-25" r="14"/>
        <circle cx="25" cy="25" r="14"/>
        <circle cx="75" cy="25" r="14"/>
      </g>
      <!-- Chocolate Center with Grid Dots -->
      <circle cx="50" cy="0" r="26" fill="#78350F" stroke="#451A03" stroke-width="3"/>
      <circle cx="45" cy="-6" r="3" fill="#D97706"/>
      <circle cx="55" cy="-6" r="3" fill="#D97706"/>
      <circle cx="50" cy="6" r="3" fill="#D97706"/>
    </g>

    <!-- Cheerful Daisies Scattered in Meadow -->
    <!-- Daisy 1 -->
    <g transform="translate(560, 920)">
      <g fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2">
        <ellipse cx="25" cy="12" rx="7" ry="12"/>
        <ellipse cx="25" cy="38" rx="7" ry="12"/>
        <ellipse cx="12" cy="25" rx="12" ry="7"/>
        <ellipse cx="38" cy="25" rx="12" ry="7"/>
      </g>
      <circle cx="25" cy="25" r="9" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    </g>

    <!-- Daisy 2 -->
    <g transform="translate(1180, 930) scale(1.2)">
      <g fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2">
        <ellipse cx="25" cy="12" rx="7" ry="12"/>
        <ellipse cx="25" cy="38" rx="7" ry="12"/>
        <ellipse cx="12" cy="25" rx="12" ry="7"/>
        <ellipse cx="38" cy="25" rx="12" ry="7"/>
      </g>
      <circle cx="25" cy="25" r="9" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    </g>

    <!-- Daisy 3 -->
    <g transform="translate(1560, 910) scale(0.9)">
      <g fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2">
        <ellipse cx="25" cy="12" rx="7" ry="12"/>
        <ellipse cx="25" cy="38" rx="7" ry="12"/>
        <ellipse cx="12" cy="25" rx="12" ry="7"/>
        <ellipse cx="38" cy="25" rx="12" ry="7"/>
      </g>
      <circle cx="25" cy="25" r="9" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
    </g>

    <!-- Tiny Ladybug on Post 2 -->
    <g transform="translate(430, 800)">
      <ellipse cx="12" cy="14" rx="10" ry="12" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
      <circle cx="12" cy="4" r="5" fill="#1E293B"/>
      <line x1="12" y1="4" x2="12" y2="26" stroke="#1E293B" stroke-width="2"/>
      <circle cx="8" cy="12" r="2" fill="#1E293B"/>
      <circle cx="16" cy="12" r="2" fill="#1E293B"/>
      <circle cx="7" cy="19" r="2" fill="#1E293B"/>
      <circle cx="17" cy="19" r="2" fill="#1E293B"/>
    </g>
  </g>
</svg>
