<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  <!-- Sun -->
  <circle cx="240" cy="180" r="90" fill="#FDE047" stroke="#CA8A04" stroke-width="4"/>
  <circle cx="240" cy="180" r="110" fill="#FEF08A" opacity="0.4"/>
  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="600" cy="220" rx="90" ry="40"/>
    <ellipse cx="660" cy="200" rx="60" ry="45"/>
    <ellipse cx="1400" cy="180" rx="110" ry="45"/>
    <ellipse cx="1470" cy="160" rx="70" ry="50"/>
  </g>
  <!-- Distant Hill -->
  <path d="M-100 750 Q450 520 1000 680 T2100 650 L2100 1080 L-100 1080 Z" fill="url(#hillGrad1)" stroke="#15803D" stroke-width="4"/>
  <!-- Foreground Meadow -->
  <path d="M-100 820 Q550 680 1200 840 T2100 780 L2100 1080 L-100 1080 Z" fill="url(#hillGrad2)" stroke="#166534" stroke-width="4"/>
  <!-- Wooden Fence -->
  <g stroke="#78350F" stroke-width="3" fill="#D97706">
    <rect x="180" y="820" width="16" height="80" rx="4"/>
    <rect x="240" y="820" width="16" height="80" rx="4"/>
    <rect x="300" y="820" width="16" height="80" rx="4"/>
    <rect x="160" y="840" width="180" height="12" rx="3"/>
    <rect x="160" y="870" width="180" height="12" rx="3"/>
  </g>
</svg>