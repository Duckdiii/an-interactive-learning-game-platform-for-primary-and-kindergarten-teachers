<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <!-- Water -->
  <rect width="1920" height="1080" fill="url(#waterGrad)"/>
  <!-- Light Rays -->
  <polygon points="300,0 450,0 600,1080 350,1080" fill="#FFFFFF" opacity="0.08"/>
  <polygon points="900,0 1100,0 1350,1080 1050,1080" fill="#FFFFFF" opacity="0.06"/>
  <!-- Sea Floor -->
  <path d="M-50 920 Q400 840 950 940 T2000 890 L2000 1080 L-50 1080 Z" fill="url(#sandGrad)" stroke="#854D0E" stroke-width="4"/>
  <!-- Bubbles -->
  <circle cx="280" cy="620" r="18" fill="#E0F2FE" opacity="0.6" stroke="#0284C7" stroke-width="2"/>
  <circle cx="320" cy="540" r="10" fill="#E0F2FE" opacity="0.6" stroke="#0284C7" stroke-width="2"/>
  <circle cx="1500" cy="450" r="24" fill="#E0F2FE" opacity="0.5" stroke="#0284C7" stroke-width="2"/>
</svg>