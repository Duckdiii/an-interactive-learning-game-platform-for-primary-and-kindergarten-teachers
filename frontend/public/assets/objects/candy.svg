<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="candyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#BE185D" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="candyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>
  <g filter="url(#candyShadow)">
    <!-- Left Wrapper Twist -->
    <path d="M42 64 L16 42 C14 56 14 72 16 86 Z" fill="#F472B6" stroke="#BE185D" stroke-width="3" stroke-linejoin="round"/>
    <path d="M16 42 L26 64 L16 86" fill="none" stroke="#DB2777" stroke-width="2"/>
    <!-- Right Wrapper Twist -->
    <path d="M86 64 L112 42 C114 56 114 72 112 86 Z" fill="#F472B6" stroke="#BE185D" stroke-width="3" stroke-linejoin="round"/>
    <path d="M112 42 L102 64 L112 86" fill="none" stroke="#DB2777" stroke-width="2"/>
    <!-- Candy Center Body -->
    <circle cx="64" cy="64" r="32" fill="url(#candyGrad)" stroke="#9D174D" stroke-width="4"/>
    <!-- Peppermint swirls / stripes -->
    <path d="M44 50 C54 44 74 44 84 50" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M38 64 C50 58 78 58 90 64" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M44 78 C54 84 74 84 84 78" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <!-- Shine -->
    <ellipse cx="54" cy="50" rx="8" ry="4" fill="#FFF" opacity="0.6" transform="rotate(-20 54 50)"/>
  </g>
</svg>