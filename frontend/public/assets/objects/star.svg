<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="starShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#B45309" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- 5-Point Cute Star -->
  <polygon points="64,14 78,48 116,48 85,71 97,106 64,84 31,106 43,71 12,48 50,48" 
           fill="url(#starGrad)" stroke="#D97706" stroke-width="4" stroke-linejoin="round" filter="url(#starShadow)"/>
  <!-- Eyes & Smile -->
  <circle cx="54" cy="62" r="3.5" fill="#78350F"/>
  <circle cx="74" cy="62" r="3.5" fill="#78350F"/>
  <circle cx="53" cy="60" r="1.2" fill="#FFF"/>
  <circle cx="73" cy="60" r="1.2" fill="#FFF"/>
  <path d="M58 70 Q64 76 70 70" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Blush -->
  <circle cx="48" cy="68" r="4" fill="#F43F5E" opacity="0.4"/>
  <circle cx="80" cy="68" r="4" fill="#F43F5E" opacity="0.4"/>
  <!-- Sparkles -->
  <polygon points="106,20 110,26 116,26 111,30 113,36 106,32 100,36 102,30 96,26 102,26" fill="#FDE047"/>
</svg>