<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="rabShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#71717A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#rabShadow)">
    <!-- Long Ears -->
    <path d="M44 54 C36 34 36 12 48 12 C60 12 56 34 52 54 Z" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="3" stroke-linejoin="round"/>
    <path d="M84 54 C92 34 92 12 80 12 C68 12 72 34 76 54 Z" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="3" stroke-linejoin="round"/>
    <!-- Inner Ears Pink -->
    <path d="M46 44 C42 30 42 18 48 18 C54 18 52 30 50 44 Z" fill="#FBCFE8"/>
    <path d="M82 44 C86 30 86 18 80 18 C74 18 76 30 78 44 Z" fill="#FBCFE8"/>
    <!-- Head -->
    <ellipse cx="64" cy="78" rx="38" ry="32" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="3"/>
    <!-- Cheeks Blush -->
    <circle cx="40" cy="84" r="7" fill="#FBCFE8" opacity="0.6"/>
    <circle cx="88" cy="84" r="7" fill="#FBCFE8" opacity="0.6"/>
    <!-- Eyes -->
    <circle cx="48" cy="74" r="5" fill="#27272A"/>
    <circle cx="80" cy="74" r="5" fill="#27272A"/>
    <circle cx="46" cy="72" r="1.5" fill="#FFF"/>
    <circle cx="78" cy="72" r="1.5" fill="#FFF"/>
    <!-- Nose & Mouth -->
    <polygon points="61,82 67,82 64,86" fill="#FB7185"/>
    <path d="M64 86 Q58 92 54 88 M64 86 Q70 92 74 88" fill="none" stroke="#52525B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Whiskers -->
    <path d="M38 82 L22 80 M38 88 L22 92 M90 82 L106 80 M90 88 L106 92" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>