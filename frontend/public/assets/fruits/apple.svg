      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#C9184A" />
    </linearGradient>
    <filter id="appleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#800F2F" flood-opacity="0.25"/>
